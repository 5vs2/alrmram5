<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>منظومة المدونة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap">
<style>
:root{--font:"Cairo",Tahoma,"Segoe UI",system-ui,sans-serif;--br:#0a1d44;--ac:#1f4fd1;--bg:#f3f5f9;--s:#fff;--ink:#14213d;--mu:#5b6b85;--ln:#e1e6ef;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1424;--s:#172036;--ink:#e8edf7;--mu:#9aa8c2;--ln:#26324d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1424;--s:#172036;--ink:#e8edf7;--mu:#9aa8c2;--ln:#26324d;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.9}
a{color:inherit}.wrap{max-width:1000px;margin:0 auto;padding:0 20px}
.ann{background:var(--ac);color:#fff;text-align:center;padding:4px 12px;font-weight:600;font-size:.9rem}
header{background:var(--br);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;min-height:64px}
.logo{font-weight:800;font-size:1.3rem;text-decoration:none;color:#fff}
nav{display:flex;gap:18px;flex-wrap:wrap;align-items:center}nav a{text-decoration:none;color:rgba(255,255,255,.85)}nav a:hover{color:#fff}
.hero{background:linear-gradient(120deg,#071a36,var(--br),#12376b);color:#fff;padding:64px 20px;text-align:center}
.hero h1{font-size:clamp(2rem,5vw,3rem);margin:.2em 0}.hero p{max-width:560px;margin:8px auto 20px;color:rgba(255,255,255,.85)}
.btn,button{font-family:inherit;background:var(--ac);color:#fff;border:0;border-radius:8px;padding:8px 18px;cursor:pointer;text-decoration:none;display:inline-block;font-size:1rem}
.btn.g,button.g{background:transparent;border:1px solid var(--ln);color:var(--ink)}button.d{background:#c0392b}
section.band{padding:40px 0}h2{margin:0 0 16px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px}
.tiles div,.card,.box{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:16px}
.tiles b{display:block;font-size:2rem;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px}
.card{padding:0;overflow:hidden;text-decoration:none;display:block;transition:transform .2s}.card:hover{transform:translateY(-3px)}
.card img,.cv{width:100%;height:150px;object-fit:cover;display:block;background:linear-gradient(135deg,var(--br),var(--ac))}
.card div{padding:14px}.card h3{margin:0 0 4px;font-size:1.1rem}.mu{color:var(--mu);font-size:.9rem}
.tag{background:var(--ac);color:#fff;border-radius:99px;padding:1px 10px;font-size:.8rem}
article{background:var(--s);border:1px solid var(--ln);border-radius:12px;padding:24px;margin:24px 0}article img.cover{width:100%;max-height:360px;object-fit:cover;border-radius:10px}
input,textarea,select{font-family:inherit;font-size:1rem;width:100%;padding:8px 12px;border:1px solid var(--ln);border-radius:8px;background:var(--bg);color:var(--ink);margin:4px 0 12px}
input[type=checkbox]{width:auto}input[type=color]{height:42px;padding:2px}label{font-weight:600;display:block}
table{width:100%;border-collapse:collapse;background:var(--s);border-radius:10px;overflow:hidden}td,th{padding:8px 10px;border-bottom:1px solid var(--ln);text-align:start}
.scroll{overflow-x:auto}.adm{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}.adm a{padding:4px 12px;border:1px solid var(--ln);border-radius:99px;text-decoration:none;background:var(--s)}.adm a.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.msg{padding:10px 14px;border-radius:8px;background:#e8f7ee;color:#14532d;margin:10px 0}.msg.e{background:#fdecea;color:#7f1d1d}
.bars{display:flex;gap:6px;align-items:flex-end;height:140px}.bars div{flex:1;background:var(--ac);border-radius:4px 4px 0 0;min-height:2px;position:relative}.bars span{position:absolute;top:-20px;font-size:.75rem;width:100%;text-align:center}
footer{text-align:center;color:var(--mu);padding:30px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
nav a{position:relative;transition:color .2s,text-shadow .2s}nav a::after{content:"";position:absolute;inset-inline:0;bottom:-3px;height:2px;background:var(--ac);box-shadow:0 0 8px var(--ac);transform:scaleX(0);transition:transform .25s}nav a:hover{text-shadow:0 0 12px var(--ac)}nav a:hover::after{transform:scaleX(1)}
.logo{transition:text-shadow .3s}.logo:hover{text-shadow:0 0 16px var(--ac)}
.tiles div,.card,.box,article,tr td,.adm a,.btn,button,.tag{transition:transform .3s,box-shadow .3s,border-color .3s,background .3s,color .3s}
.card:hover,.tiles div:hover{transform:translateY(-6px);border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 18px 40px color-mix(in srgb,var(--ac) 35%,transparent)}
.box:hover,article:hover{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 10px 30px color-mix(in srgb,var(--ac) 22%,transparent)}
.card img,.card .cv{transition:transform .4s}.card:hover img,.card:hover .cv{transform:scale(1.06)}
.btn:hover,button:hover{transform:translateY(-2px);box-shadow:0 0 22px color-mix(in srgb,var(--ac) 55%,transparent)}button.d:hover{box-shadow:0 0 18px #c0392b99}
.btn.g:hover,button.g:hover{border-color:var(--ac);color:var(--ac)}
.adm a:hover{background:var(--ac);color:#fff;border-color:var(--ac);box-shadow:0 0 16px color-mix(in srgb,var(--ac) 55%,transparent)}
tr:hover td{background:color-mix(in srgb,var(--ac) 10%,transparent)}
input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ac);box-shadow:0 0 0 3px color-mix(in srgb,var(--ac) 35%,transparent)}
.tag:hover{box-shadow:0 0 12px var(--ac)}.hero .btn{box-shadow:0 0 26px color-mix(in srgb,var(--ac) 55%,transparent)}
.att{display:flex;gap:8px;flex-wrap:wrap}
.ph{width:180px;height:180px;border-radius:50%;object-fit:cover;padding:5px;background:linear-gradient(135deg,var(--ac),transparent 60%,var(--ac));box-shadow:0 0 50px color-mix(in srgb,var(--ac) 45%,transparent);transition:transform .4s;display:block;margin:0 auto 10px}.ph:hover{transform:scale(1.04) rotate(-2deg)}
.socs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}.soc{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--s);color:var(--ink);border:1px solid var(--ln);text-decoration:none;font-weight:800;font-size:.9rem;transition:transform .3s,box-shadow .3s,background .3s,color .3s}.soc:hover{background:var(--ac);color:#fff;border-color:var(--ac);transform:translateY(-3px);box-shadow:0 0 18px color-mix(in srgb,var(--ac) 60%,transparent)}
::selection{background:var(--ac);color:#fff}html{scroll-behavior:smooth}
::-webkit-scrollbar{width:10px}::-webkit-scrollbar-thumb{background:color-mix(in srgb,var(--ac) 60%,transparent);border-radius:8px}
body::before{content:"";position:fixed;top:0;inset-inline:0;height:3px;background:var(--ac);box-shadow:0 0 10px var(--ac);transform-origin:right;transform:scaleX(0);z-index:50;animation:prog auto linear;animation-timeline:scroll(root)}@keyframes prog{to{transform:scaleX(1)}}
header{background:color-mix(in srgb,var(--br) 88%,transparent);backdrop-filter:blur(12px);box-shadow:0 2px 20px rgba(0,0,0,.25);border-bottom:1px solid rgba(255,255,255,.08)}
.hero{position:relative;overflow:hidden;background:linear-gradient(120deg,#071a36,var(--br),#12376b,var(--br));background-size:300% 300%;animation:shift 14s ease infinite;padding:88px 20px}
.hero::before,.hero::after{content:"";position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(90px);opacity:.35;background:var(--ac);pointer-events:none}.hero::before{top:-160px;inset-inline-start:-120px}.hero::after{bottom:-200px;inset-inline-end:-100px;animation:flt 9s ease-in-out infinite}.hero>*{position:relative;z-index:1}
@keyframes shift{50%{background-position:100% 50%}}@keyframes flt{50%{transform:translateY(-40px)}}@keyframes up{from{opacity:0;transform:translateY(22px)}}
.hero h1{background:linear-gradient(90deg,#fff,#b9ccff,#fff);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:-.5px}
.band,article,.box,.card{animation:up .7s backwards}.grid .card:nth-child(2){animation-delay:.08s}.grid .card:nth-child(3){animation-delay:.16s}.grid .card:nth-child(n+4){animation-delay:.24s}
.band h2::after{content:"";display:block;width:48px;height:4px;border-radius:4px;background:var(--ac);box-shadow:0 0 12px var(--ac);margin-top:6px}
article h1{margin-top:0;font-size:clamp(1.6rem,4vw,2.4rem);line-height:1.4}article p{font-size:1.08rem}
footer{border-top:1px solid var(--ln);margin-top:40px}
#up{position:fixed;inset-inline-start:18px;bottom:calc(18px + env(safe-area-inset-bottom,0px));width:44px;height:44px;border-radius:50%;padding:0;opacity:0;pointer-events:none;z-index:30;box-shadow:0 0 18px color-mix(in srgb,var(--ac) 50%,transparent)}#up.on{opacity:1;pointer-events:auto}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.vwrap{aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;margin:14px 0;display:grid;place-items:center;color:#fff;box-shadow:0 0 30px color-mix(in srgb,var(--ac) 30%,transparent)}.vwrap video,.vwrap iframe{width:100%;height:100%;border:0;background:#000}
.toc{display:grid;gap:4px;margin:14px 0}.toc a{text-decoration:none;color:var(--ac)}.toc a:hover{text-shadow:0 0 10px var(--ac)}h2{scroll-margin-top:90px}
.hin{display:flex;align-items:center;justify-content:center;gap:56px;max-width:1000px;margin:0 auto;text-align:start}.hin .htx{flex:1;min-width:0}.hin .htx p{margin-inline:0}.hin .socs{justify-content:flex-start}
.hin.nop{text-align:center}.hin.nop .htx p{margin-inline:auto}.hin.nop .socs{justify-content:center}
.pf{position:relative;width:270px;height:270px;flex:none;border-radius:50%;animation:bob 7s ease-in-out infinite}
.pf::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--ac),transparent 25%,rgba(255,255,255,.45) 40%,transparent 60%,var(--ac) 80%,transparent);animation:spin 8s linear infinite}
.pf::after{content:"";position:absolute;inset:-34px;border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 55%,transparent),transparent 70%);z-index:-1;filter:blur(18px)}
.pf img{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:6px solid var(--br);display:block;box-shadow:0 20px 50px rgba(0,0,0,.45);transition:transform .5s}.pf:hover img{transform:scale(1.04)}
@keyframes spin{to{transform:rotate(360deg)}}@keyframes bob{50%{transform:translateY(-10px)}}
@media (max-width:760px){.hin{flex-direction:column-reverse;gap:34px;text-align:center}.hin .htx p{margin-inline:auto}.hin .socs{justify-content:center}.pf{width:210px;height:210px}}
header{transition:background .35s,box-shadow .35s,border-color .35s}
body.home header{margin-bottom:calc(var(--hh,64px)*-1)}
body.home:not(.sc) header{background:transparent;backdrop-filter:none;box-shadow:none;border-bottom-color:transparent}
.hero.big{padding:var(--hh,64px) 20px 0;min-height:clamp(540px,92vh,800px);display:flex}
.hero.big .hin{align-items:stretch;gap:0;width:100%;max-width:1060px}
.hero.big .htx{align-self:center;padding:48px 0 64px;z-index:2}
.hp{position:relative;flex:0 0 46%;max-width:500px;margin-top:calc(var(--hh,64px)*-1)}
.hp::before{content:"";position:absolute;inset:14% -6% 0;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 65%,transparent),transparent 78%);filter:blur(34px);z-index:-1;animation:glow 6s ease-in-out infinite}
.hp img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block;-webkit-mask-image:linear-gradient(to left,transparent 0,#000 38%),linear-gradient(to top,transparent 0,#000 16%);-webkit-mask-composite:source-in;mask-image:linear-gradient(to left,transparent 0,#000 38%),linear-gradient(to top,transparent 0,#000 16%);mask-composite:intersect;filter:drop-shadow(0 0 24px color-mix(in srgb,var(--ac) 40%,transparent))}
@keyframes glow{50%{opacity:.65;transform:scale(1.05)}}
@media (max-width:760px){.hero.big{display:block;min-height:0;padding-bottom:0}.hero.big .hin{flex-direction:column-reverse}.hp{flex:none;max-width:none;width:100%;height:400px}.hp img{-webkit-mask-image:linear-gradient(to top,transparent 0,#000 40%);mask-image:linear-gradient(to top,transparent 0,#000 40%);-webkit-mask-composite:source-over;mask-composite:add}.hero.big .htx{padding:10px 0 50px}}
@keyframes pin{from{opacity:0;transform:translateX(-46px) scale(1.04)}}
.hp img{animation:pin 1.2s cubic-bezier(.2,.7,.2,1) backwards;translate:calc(var(--mx,0)*16px) calc(var(--my,0)*8px);transition:translate .5s ease-out;filter:contrast(1.06) saturate(1.06) drop-shadow(0 0 22px color-mix(in srgb,var(--ac) 45%,transparent))}
.hp::after{content:"";position:absolute;inset:16% 2% 8%;border-radius:50%;border:1px solid rgba(255,255,255,.16);box-shadow:0 0 0 38px rgba(255,255,255,.03),0 0 0 84px rgba(255,255,255,.02);z-index:-1;translate:calc(var(--mx,0)*-10px) calc(var(--my,0)*-6px);transition:translate .5s ease-out}
.hero.big{border-bottom:1px solid color-mix(in srgb,var(--ac) 55%,transparent)}
.hb{position:absolute;bottom:34px;inset-inline-start:-10px;display:flex;align-items:center;gap:12px;padding:10px 18px;border-radius:16px;background:rgba(255,255,255,.08);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);box-shadow:0 10px 30px rgba(0,0,0,.3),0 0 24px color-mix(in srgb,var(--ac) 35%,transparent);animation:bob 6s ease-in-out infinite;z-index:3}
.hb b{display:block;line-height:1.4}.hb span{font-size:.82rem;color:rgba(255,255,255,.75)}.hb i{width:10px;height:10px;border-radius:50%;background:#37e08a;box-shadow:0 0 12px #37e08a;flex:none}
@media (max-width:760px){.hb{inset-inline-start:auto;left:50%;translate:-50% 0;bottom:22px;white-space:nowrap}}
.bar{min-height:48px;gap:6px 10px}.logo{font-size:1.1rem}nav{gap:14px}nav a,nav button{font-size:.9rem}header .bar a{line-height:1.6}
@media (min-width:761px){.hero.big{min-height:100vh;min-height:100svh}}
.hero:not(.big){padding-top:calc(var(--hh,64px) + 48px)}@media (min-width:761px){.pf{width:280px;height:280px}}.pf .hb{inset-inline-start:auto;left:50%;translate:-50% 0;bottom:-18px;white-space:nowrap}
</style>

<body>
<div id="app"></div><button id="up" aria-label="للأعلى">↑</button>
<script>
const K='blog-system-v1',$=s=>document.querySelector(s),app=$('#app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const day=()=>new Date().toISOString().slice(0,10),fmt=d=>new Date(d).toLocaleDateString('ar-LY');
const def=()=>({set:{name:'مدونتي',tag:'مدوّن تقني',bio:'اكتب هنا نبذة قصيرة عنك من لوحة التحكم ← الإعدادات.',email:'',navy:'#0a1d44',blue:'#1f4fd1',ann:'',foot:''},
cats:[{id:1,name:'التدوينات'}],
posts:[{id:2,kind:'post',title:'أهلاً بك في مدونتك',cat:1,body:'## البداية\n\nهذا مقال تجريبي. افتح لوحة التحكم من رابط «دخول» (المستخدم admin وكلمة المرور admin12345) ثم عدّله أو احذفه.\n\nسطر جديد يُكتب هنا\nويظهر في السطر التالي.',cover:'',link:'',status:'published',created:new Date().toISOString(),views:0}],
pages:[{id:3,slug:'about',title:'من أنا',body:'اكتب هنا نبذة تعريفية عنك.',nav:1}],com:[],msg:[],days:{},pw:null,nid:10});
let D;try{D=JSON.parse(localStorage.getItem(K))}catch(e){}D=D||def();
const save=()=>{try{localStorage.setItem(K,JSON.stringify(D));return true}catch(e){flash('تعذّر الحفظ (ربما الصور كبيرة)',1);return false}};
let adm=false;try{adm=sessionStorage.getItem('adm')==='1'}catch(e){}
let Q='',C=0,note='';
const flash=(m,e)=>{note=`<div class="msg${e?' e':''}">${m}</div>`};
const sha=async t=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode('salt:'+t)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const rend=t=>esc(t).split(/\n{2,}/).map((b,i)=>(b=b.trim())?(b.startsWith('## ')?`<h2 id="s${i}">${b.slice(3)}</h2>`:`<p>${b.replace(/\n/g,'<br>')}</p>`):'').join('');
const SOC=[['facebook','فيسبوك','f'],['x','إكس (تويتر)','𝕏'],['instagram','إنستغرام','IG'],['youtube','يوتيوب','▶'],['tiktok','تيك توك','♪'],['telegram','تيليغرام','✈'],['whatsapp','واتساب','WA'],['linkedin','لينكدإن','in'],['github','جيت هب','GH']];
const socHtml=()=>SOC.filter(s=>/^https:\/\//.test((D.set.soc||{})[s[0]]||'')).map(s=>`<a class="soc" href="${esc(D.set.soc[s[0]])}" target="_blank" rel="noopener noreferrer" title="${s[1]}" aria-label="${s[1]}">${s[2]}</a>`).join('');
const yt=u=>{let m=u.match(/(?:youtube\.com\/(?:watch\?v=|embed\/|shorts\/)|youtu\.be\/)([\w-]{11})/);if(m)return 'https://www.youtube-nocookie.com/embed/'+m[1];m=u.match(/vimeo\.com\/(\d+)/);return m?'https://player.vimeo.com/video/'+m[1]:''};
const vidHtml=p=>{let h='';if(p.vid)h+=`<div class="vwrap" id="vp" data-id="${esc(p.vid.id)}">جارٍ تحميل الفيديو…</div>`;
if(p.vurl){const e=yt(p.vurl);h+=e?`<div class="vwrap"><iframe src="${e}" allowfullscreen loading="lazy" referrerpolicy="strict-origin-when-cross-origin" allow="fullscreen; picture-in-picture"></iframe></div>`:/\.(mp4|webm|ogg)(\?|$)/i.test(p.vurl)?`<div class="vwrap"><video controls playsinline controlsList="nodownload noremoteplayback" disablepictureinpicture src="${esc(p.vurl)}"></video></div>`:''}return h};
const tocOf=p=>{const hs=p.body.split(/\n{2,}/).map((b,i)=>b.trim().startsWith('## ')?[i,b.trim().slice(3)]:null).filter(Boolean);return hs.length>=3?`<div class="box toc"><b>محتويات المقال</b>${hs.map(h=>`<a href="#" data-a="go" data-id="s${h[0]}">${esc(h[1])}</a>`).join('')}</div>`:''};
const catName=id=>(D.cats.find(c=>c.id==id)||{}).name||'';
const pub=(k,n=99)=>D.posts.filter(p=>p.status==='published'&&p.kind===k).sort((a,b)=>b.id-a.id).slice(0,n);
const cards=a=>a.length?`<div class="grid">${a.map(p=>`<a class="card" href="#post-${p.id}">${p.cover?`<img src="${p.cover}" alt="">`:'<div class="cv" style="padding:0"></div>'}<div><h3>${(p.vid||p.vurl)?'▶ ':''}${esc(p.title)}</h3><span class="mu">${fmt(p.created)}</span> ${p.cat?`<span class="tag">${esc(catName(p.cat))}</span>`:''}<p class="mu">${esc(p.body.replace(/^## /gm,'').slice(0,110))}…</p></div></a>`).join('')}</div>`:'<p class="mu">لا يوجد محتوى بعد.</p>';
function layout(inner){const S=D.set;document.documentElement.style.setProperty('--br',S.navy);document.documentElement.style.setProperty('--ac',S.blue);document.title=S.name;
return `${S.ann?`<div class="ann">${esc(S.ann)}</div>`:''}<header><div class="wrap bar"><a class="logo" href="#home">${esc(S.name)}</a><nav><a href="#home">الرئيسية</a><a href="#blog">المدونة</a><a href="#podcast">بودكاست</a><a href="#videos">فيديو</a>${D.pages.filter(p=>p.nav).map(p=>`<a href="#page-${p.slug}">${esc(p.title)}</a>`).join('')}<a href="#contact">تواصل</a><a href="#" data-a="theme" title="تبديل المظهر">◐</a>${adm?'<a href="#admin">لوحة التحكم</a><a href="#" data-a="out">خروج</a>':''}</nav></div></header>${inner}<footer><div class="socs">${socHtml()}</div>${esc(S.foot)||'© '+new Date().getFullYear()+' '+esc(S.name)}</footer>`}
function hit(pid){if(adm)return;D.days[day()]=(D.days[day()]||0)+1;const p=D.posts.find(x=>x.id==pid);if(p)p.views=(p.views||0)+1;save()}
const main=h=>`<main class="wrap">${note}${h}</main>`;

function route(){const h=location.hash.slice(1)||'home',p=h.split('-');let v;
if(p[0]==='admin'){if(!adm){location.hash='login';return}v=admin(p)}
else if(p[0]==='post')v=V.post(p[1]);else if(h.startsWith('page-'))v=V.page(h.slice(5));else v=(V[h]&&h!=='nf'&&h!=='post'&&h!=='page')?V[h]():V.nf();
app.innerHTML=layout(v);note='';window.scrollTo(0,0);countUp();loadVid();document.body.classList.toggle('home',h==='home');document.body.classList.toggle('sc',scrollY>30);setHH()}
function setHH(){const e=document.querySelector('header');if(e)document.documentElement.style.setProperty('--hh',e.offsetHeight+'px')}
addEventListener('resize',setHH);addEventListener('load',setHH);addEventListener('scroll',()=>document.body.classList.toggle('sc',scrollY>30));if(document.fonts&&document.fonts.ready)document.fonts.ready.then(setHH);
document.addEventListener('mousemove',e=>{const h=document.querySelector('.hp');if(h){h.style.setProperty('--mx',(e.clientX/innerWidth-.5).toFixed(3));h.style.setProperty('--my',(e.clientY/innerHeight-.5).toFixed(3))}});
function loadVid(){const el=document.getElementById('vp');if(!el)return;idbOp('get',el.dataset.id).then(b=>{if(!b){el.textContent='الفيديو غير متوفر على هذا الجهاز';return}const v=document.createElement('video');v.controls=true;v.playsInline=true;v.disablePictureInPicture=true;v.setAttribute('controlsList','nodownload noremoteplayback');v.src=URL.createObjectURL(b);el.replaceChildren(v)}).catch(()=>{el.textContent='تعذّر تشغيل الفيديو'})}
document.addEventListener('contextmenu',e=>{if(e.target.tagName==='VIDEO')e.preventDefault()});try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
function countUp(){document.querySelectorAll('.tiles b').forEach(b=>{const n=+b.textContent;if(!n)return;let i=0;b.textContent=0;const t=setInterval(()=>{i+=Math.max(1,Math.ceil(n/20));if(i>=n){i=n;clearInterval(t)}b.textContent=i},40)})}
addEventListener('hashchange',route);
const rd=(f,m=900)=>new Promise(r=>{if(!f||!f.size)return r(null);const i=new Image,u=URL.createObjectURL(f);i.onload=()=>{const k=Math.min(1,m/i.width),c=document.createElement('canvas');c.width=i.width*k;c.height=i.height*k;c.getContext('2d').drawImage(i,0,0,c.width,c.height);r(c.toDataURL(f.type==='image/png'||f.type==='image/webp'?'image/webp':'image/jpeg',.85))};i.onerror=()=>r(null);i.src=u});
const url=v=>/^https:\/\/[^\s<>"'`]{1,250}$/.test(v)?v:'';
const MAXF=300*1024*1024,sz=n=>n>1048576?(n/1048576).toFixed(1)+' MB':Math.ceil((n||0)/1024)+' KB';
const idb=()=>new Promise((res,rej)=>{const q=indexedDB.open('blog-files',1);q.onupgradeneeded=()=>q.result.createObjectStore('f');q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)});
const idbOp=async(m,...a)=>{const db=await idb();return new Promise((res,rej)=>{const t=db.transaction('f',m==='get'?'readonly':'readwrite'),r=t.objectStore('f')[m](...a);t.oncomplete=()=>res(r.result);t.onerror=t.onabort=()=>rej(t.error)})};
const rf=async fs=>{const has=fs.filter(f=>f.size),ok=has.filter(f=>f.size<=MAXF);if(ok.length<has.length)flash('تم تجاهل الملفات الأكبر من 300 ميغابايت',1);const out=[];
for(const f of ok){const id='f'+Date.now()+'-'+nid();try{await idbOp('put',f,id);out.push({id,n:f.name,t:f.type,s:f.size})}catch(e){flash('تعذّر تخزين «'+f.name+'» (المساحة ممتلئة؟)',1)}}return out};
const nid=()=>D.nid++;
const F={
async login(d){const h=await sha(d.p),ok=d.u==='admin'&&(D.pw?D.pw===h:d.p==='admin12345');if(!ok){flash('بيانات الدخول غير صحيحة',1);return route()}adm=true;try{sessionStorage.setItem('adm','1')}catch(e){}location.hash='admin'},
com(d,f){D.com.push({id:nid(),post:+f.dataset.id,name:d.name.trim().slice(0,60),body:d.body.trim().slice(0,1500),ok:0,created:new Date().toISOString()});save();flash('تم الإرسال، سيظهر تعليقك بعد المراجعة');route()},

async post(d,f){const id=f.dataset.id,img=await rd(f.cover.files[0]),nfl=await rf([...f.files.files]),vf=await rf([...f.vfile.files]);let x=id?D.posts.find(p=>p.id==id):{id:nid(),created:new Date().toISOString(),views:0,cover:''};
Object.assign(x,{title:d.title.trim(),kind:d.kind,cat:+d.cat||null,status:d.status,body:d.body.trim(),link:url(d.link.trim())});if(img)x.cover=img;else if(d.rmc)x.cover='';(x.files||[]).filter((_,i)=>d['rmf'+i]).forEach(f=>f.id&&idbOp('delete',f.id).catch(()=>{}));x.files=(x.files||[]).filter((_,i)=>!d['rmf'+i]).concat(nfl);x.vurl=url(d.vurl.trim());if(d.rmv&&x.vid){idbOp('delete',x.vid.id).catch(()=>{});x.vid=null}if(vf[0]){if(x.vid)idbOp('delete',x.vid.id).catch(()=>{});x.vid=vf[0]}
if(!id)D.posts.push(x);if(save())location.hash='admin-posts'},

page(d,f){const id=f.dataset.id,slug=d.slug.trim().toLowerCase();if(!/^[a-z0-9-]{1,40}$/.test(slug)||D.pages.some(p=>p.slug===slug&&p.id!=id)){flash('الرابط غير صالح أو مستخدم',1);return route()}
const x=id?D.pages.find(p=>p.id==id):{id:nid()};Object.assign(x,{slug,title:d.title.trim(),body:d.body.trim(),nav:d.nav?1:0});if(!id)D.pages.push(x);save();location.hash='admin-pages'},
look(d){if(!/^#[0-9a-f]{6}$/i.test(d.navy)||!/^#[0-9a-f]{6}$/i.test(d.blue))return;Object.assign(D.set,{navy:d.navy,blue:d.blue,ann:d.ann.trim(),foot:d.foot.trim()});save();flash('تم الحفظ');route()},
async set(d,f){const img=await rd(f.photo.files[0],1100);Object.assign(D.set,{name:d.name.trim(),tag:d.tag.trim(),bio:d.bio.trim()});D.set.soc=Object.fromEntries(SOC.map(s=>[s[0],url(String(d['s_'+s[0]]||'').trim())]));if(img)D.set.photo=img;else if(d.rmp)D.set.photo='';save();flash('تم الحفظ');route()},
async pw(d){const c=await sha(d.cur);if(D.pw?D.pw!==c:d.cur!=='admin12345'){flash('كلمة المرور الحالية غير صحيحة',1);return route()}D.pw=await sha(d.np);save();flash('تم تغيير كلمة المرور');route()}};
document.addEventListener('submit',e=>{const f=e.target;if(!f.dataset.f)return;e.preventDefault();F[f.dataset.f](Object.fromEntries(new FormData(f)),f)});
document.addEventListener('input',e=>{if(e.target.id==='q'){Q=e.target.value;$('#list').innerHTML=blogList()}});
document.addEventListener('change',e=>{if(e.target.id==='c'){C=+e.target.value;$('#list').innerHTML=blogList()}});
const T={post:'posts',cat:'cats',page:'pages',com:'com',msg:'msg'};
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el)return;e.preventDefault();const [a,t]=el.dataset.a.split('-'),id=el.dataset.id;
if(a==='go'){const h=document.getElementById(id);if(h)h.scrollIntoView({behavior:'smooth'});return}
if(a==='cp'){if(navigator.clipboard)navigator.clipboard.writeText(location.href).then(()=>alert('تم نسخ الرابط')).catch(()=>{});return}
if(a==='theme'){const r=document.documentElement,dk=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme:dark)').matches;r.dataset.theme=dk?'light':'dark';try{localStorage.setItem('blog-theme',r.dataset.theme)}catch(x){}return}
if(a==='dl'){idbOp('get',id).then(b=>{if(!b)return alert('الملف غير موجود');const u=URL.createObjectURL(b),l=document.createElement('a');l.href=u;l.download=el.dataset.n;l.click();setTimeout(()=>URL.revokeObjectURL(u),9e3)}).catch(()=>alert('تعذّر فتح الملف'));return}
if(a==='out'){adm=false;try{sessionStorage.removeItem('adm')}catch(x){}location.hash='home';return route()}
if(a==='del'){if(!confirm('تأكيد الحذف؟'))return;const k=T[t];if(t==='cat')D.posts.forEach(p=>{if(p.cat==id)p.cat=null});if(t==='post'){[...((D.posts.find(p=>p.id==id)||{}).files||[]),(D.posts.find(p=>p.id==id)||{}).vid].forEach(f=>f&&f.id&&idbOp('delete',f.id).catch(()=>{}));D.com=D.com.filter(c=>c.post!=id)}D[k]=D[k].filter(r=>r.id!=id);}
if(a==='ok'){D.com.find(c=>c.id==id).ok=1}
if(a==='restore'){try{const n=JSON.parse($('#bk').value);if(!n.set||!n.posts)throw 0;D=n;save();flash('تمت الاستعادة')}catch(x){flash('النص غير صالح',1)}}
save();route()});
try{const th=localStorage.getItem('blog-theme');if(th)document.documentElement.dataset.theme=th}catch(e){}
addEventListener('scroll',()=>$('#up').classList.toggle('on',scrollY>400));$('#up').onclick=()=>scrollTo({top:0,behavior:'smooth'});
route();
